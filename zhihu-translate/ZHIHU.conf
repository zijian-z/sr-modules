#!name=🅉🅷🅸🅷🆄 知乎自动翻译（中文转外语）
#!icon=https://www.google.com/s2/favicons?domain=zhihu.com&sz=128
#!desc=调用 Google 翻译为知乎 App 生成双语对照：问题标题与回答正文逐段追加译文，默认中文转英文；覆盖回答详情、推荐流展开、问题页与回答列表；需开启 MITM 并信任根证书；问题补充说明（HTML）与专栏文章暂不支持
#!arguments=翻译目标语言:en, 调试通知:关
#!arguments-desc=翻译目标语言：默认 en（英语），支持 ja（日语）、ko（韩语）、fr（法语）、de（德语）等 Google 翻译语言代码。\n\n调试通知：开=每次翻译后弹系统通知显示成功段数与失败原因；关=仅完全失败时通知。
#!author=zijian-z
#!homepage=https://github.com/zijian-z/sr-modules

[Rule]
AND,((PROTOCOL,UDP),(DEST-PORT,443),(DOMAIN,api.zhihu.com)),REJECT

[Script]
Zhihu-AnswerDetail = type=http-response,pattern=^https://api\.zhihu\.com/answers/v2/\d+,requires-body=1,max-size=4194304,timeout=30,script-path=https://raw.githubusercontent.com/zijian-z/sr-modules/main/zhihu-translate/zhihu_translate.js,argument={{{翻译目标语言}}}|{{{调试通知}}}
Zhihu-NextRender = type=http-response,pattern=^https://api\.zhihu\.com/next-render,requires-body=1,max-size=4194304,timeout=30,script-path=https://raw.githubusercontent.com/zijian-z/sr-modules/main/zhihu-translate/zhihu_translate.js,argument={{{翻译目标语言}}}|{{{调试通知}}}
Zhihu-QuestionDetail = type=http-response,pattern=^https://api\.zhihu\.com/questions/\d+\?,requires-body=1,max-size=4194304,timeout=30,script-path=https://raw.githubusercontent.com/zijian-z/sr-modules/main/zhihu-translate/zhihu_translate.js,argument={{{翻译目标语言}}}|{{{调试通知}}}
Zhihu-QuestionFeeds = type=http-response,pattern=^https://api\.zhihu\.com/questions/\d+/feeds,requires-body=1,max-size=4194304,timeout=30,script-path=https://raw.githubusercontent.com/zijian-z/sr-modules/main/zhihu-translate/zhihu_translate.js,argument={{{翻译目标语言}}}|{{{调试通知}}}

[MITM]
hostname = %APPEND% api.zhihu.com
