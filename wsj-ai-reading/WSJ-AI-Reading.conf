#!name=WSJ AI 英语精读
#!icon=https://www.google.com/s2/favicons?domain=wsj.com&sz=128
#!desc=用 Z.AI GLM-5.3-Flash 为 WSJ iOS App 的英文文章加词组释义与长句提示。
#!arguments=ZAI_API_KEY:请填写, 调试通知:关
#!arguments-desc=ZAI_API_KEY：填写具备 Z.AI 通用 API 和 GLM-5.3-Flash 权限的 Key，Coding Plan 额度不适用。启用后会把文章文本发送给 Z.AI。\n\n调试通知：开=显示每篇文章的注释结果；关=仅提示失败。
#!author=zijian-z
#!homepage=https://github.com/zijian-z/sr-modules

[Rule]
AND,((PROTOCOL,UDP),(DEST-PORT,443),(DOMAIN-SUFFIX,dowjones.io)),REJECT

[Script]
WSJ-AI-Reading = type=http-response,pattern=^https://shared-data\.dowjones\.io/gateway/graphql\?.*(operationName=ArticleContent|d81a2cb8bdfb),requires-body=1,max-size=4194304,timeout=35,script-path=https://raw.githubusercontent.com/zijian-z/sr-modules/main/wsj-ai-reading/wsj_ai_reading.js?v=2,argument={{{ZAI_API_KEY}}}|{{{调试通知}}}

[MITM]
hostname = %APPEND% shared-data.dowjones.io
