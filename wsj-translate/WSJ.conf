#!name=🆆🆂🅹 WSJ 自动翻译
#!icon=https://www.google.com/s2/favicons?domain=wsj.com&sz=128
#!desc=调用 Google 翻译为 WSJ App（原生文章页）生成双语对照：标题、副标题与正文逐段追加译文；需在 Shadowrocket 开启 HTTPS 解密并信任根证书；已读过的文章可能有本地缓存需重新进入触发
#!arguments=翻译目标语言:zh-CN, 调试通知:关
#!arguments-desc=翻译目标语言：填写 Google 翻译支持的语言代码，默认 zh-CN（简体中文）。支持 zh-TW（台湾繁体）、zh-HK（香港繁体）、ja（日语）、ko（韩语）等。\n\n调试通知：开=每次翻译后弹系统通知显示成功段数与失败原因；关=仅完全失败时通知。
#!author=zijian-z
#!homepage=https://github.com/zijian-z/sr-modules

[Rule]
AND,((PROTOCOL,UDP),(DEST-PORT,443),(DOMAIN-SUFFIX,dowjones.io)),REJECT

[Script]
WSJ-Translate = type=http-response,pattern=^https://shared-data\.dowjones\.io/gateway/graphql\?.*(operationName=ArticleContent|d81a2cb8bdfb),requires-body=1,max-size=4194304,timeout=30,script-path=https://raw.githubusercontent.com/zijian-z/sr-modules/main/wsj-translate/wsj_translate.js,argument={{{翻译目标语言}}}|{{{调试通知}}}

[MITM]
hostname = %APPEND% shared-data.dowjones.io
